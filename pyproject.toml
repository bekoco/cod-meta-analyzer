[project]
name = "cod-meta-analyzer"
version = "0.1.0"
description = "Analyse des données officielles de la Call of Duty World League 2017-2019 : PostgreSQL, SQL, Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
